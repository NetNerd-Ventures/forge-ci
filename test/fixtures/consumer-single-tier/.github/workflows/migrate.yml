name: migrate
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bootstrap:
        description: Seed _migration_log without applying SQL (adopted database)
        type: boolean
        default: false
permissions:
  contents: read
  issues: write
jobs:
  migrate:
    uses: NetNerd-Ventures/forge-ci/.github/workflows/migrate.yml@v1
    with:
      forge-ci-ref: v1
      integration-branch: main
      bootstrap: ${{ github.event_name == 'workflow_dispatch' && inputs.bootstrap || false }}
    secrets: inherit
